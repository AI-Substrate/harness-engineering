name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npx biome check harness/cli

      - name: Build (tsc emit)
        run: npm run build

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit -p harness/cli/tsconfig.json

      - name: Test with coverage
        run: cd harness/cli && npx vitest run --coverage

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-node${{ matrix.node }}
          path: harness/cli/coverage/lcov.info
          if-no-files-found: error

      - name: Audit (advisory)
        run: npm audit --audit-level=high || true

  # Stable, matrix-independent required check for branch protection (T005).
  # Always runs and fails if any required job failed/cancelled.
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs: [build-test, package-smoke]
    if: always()
    steps:
      - name: Verify required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed."
          exit 1
      - name: All required jobs passed
        run: echo "All required jobs passed."

  # Packaging / bin-symlink smoke (companion F005 guard): pack the tarball,
  # install it into a clean temp project, and invoke the installed `harness`
  # bin through its symlink. Generic invocation only — never asserts the
  # temporary BUILTIN_SLOTS set (Constitution P10 / Phase 3 forward-note).
  package-smoke:
    name: package-smoke
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack and smoke-test the installed bin
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          echo "Packed: $TARBALL"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          echo "Installed bin symlink:"
          ls -l node_modules/.bin/harness
          echo "harness --version:"
          ./node_modules/.bin/harness --version
          echo "harness doctor (generic, exit code only):"
          ./node_modules/.bin/harness doctor

