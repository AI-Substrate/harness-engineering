name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npx biome check harness/cli

      - name: Build (tsc emit)
        run: npm run build

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit -p harness/cli/tsconfig.json

      - name: Test with coverage
        run: cd harness/cli && npx vitest run --coverage

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-node${{ matrix.node }}
          path: harness/cli/coverage/lcov.info
          if-no-files-found: error

      - name: Audit (advisory)
        run: npm audit --audit-level=high || true

  # Stable, matrix-independent required check for branch protection (T005).
  # Always runs and fails if any required job failed/cancelled.
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs: [build-test]
    if: always()
    steps:
      - name: Verify required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs did not succeed."
          exit 1
      - name: All required jobs passed
        run: echo "All required jobs passed."
