# The `windows-latest` suite leg — ON DEMAND, REPORT-ONLY (plan 077 · #108).
#
# WHY THIS EXISTS
# ---------------
# `windows-check` found ZERO of the four Windows defects fixed in `5a8e8f5b`, and
# cleared zero. Every one was a logical-vs-native path-shape mismatch at a
# comparison, which no per-line lint can see. Until this job existed, the only
# instrument that could see that class was a person in another organisation
# volunteering to run our suite on their laptop — a favour, not a supply chain,
# and the reason the Windows failure count drifted to 134 before anyone noticed.
#
# WHY IT IS WARN-LAUNCH, AND WHY THAT IS NOT APATHY
# -------------------------------------------------
# The suite is NOT green on Windows today, so a blocking job would break every PR
# on day one. This ships in the same warn-launch posture as `windows-check`,
# `arch-check` and `markdown-lint`: it runs, it reports, it blocks nothing.
# `non-blocking` here means "we are not yet entitled to gate on it", NOT "nobody
# cared" — promotion to a required check is a separate, evidenced decision that
# belongs to whoever owns this once it is actually green. Do not wire it into
# `ci-required` or branch protection before then.
#
# THE ONE RULE: IT MUST NOT BE ABLE TO GO GREEN BY SKIPPING
# ---------------------------------------------------------
# This round deliberately added win32 skips (the real-`git daemon` cluster, the
# URL-scope credential case). A Windows job that goes green BECAUSE the hard
# things are switched off is a control that cannot fail, which is the exact shape
# this plan has spent five rounds removing from the codebase. So the summary
# reports passed / failed / SKIPPED as three numbers, and any skip at all raises
# a visible annotation. This job's job is to tell the truth, not to be green.
#
# WHAT A GREEN RUN HERE DOES *NOT* MEAN — read before quoting this job
# --------------------------------------------------------------------
# A hosted runner is CURATED and is not a proxy for a user's machine. This is
# measured, not assumed (ac-0005): `jq` 1.8.1 is present on the runner and ABSENT
# on the consumer's box, so a green leg would have said nothing about the failure
# they actually hit. Two defects from this very round make the gap concrete:
#
#   * `acts/plan` failed on their box only because an UNELEVATED process cannot
#     create `C:\out`. A runner with more privilege goes GREEN while happily
#     creating a directory at the drive root — the defect is invisible to CI BY
#     CONSTRUCTION, not by accident.
#   * the timeout class is contention-dependent. A quiet runner can finish in 12s
#     what takes a loaded laptop 30s, so this leg systematically under-reports
#     exactly the failures that are about load.
#
# Therefore: a green run means THE PATH-SHAPE CLASS IS COVERED. It never means
# "Windows is fine". That sentence is reproduced in the job summary so it travels
# with the result instead of living only here.
#
# This file is deliberately dispatch-only and self-contained. GitHub only exposes
# `workflow_dispatch` for workflows present on the DEFAULT branch, so it has to
# land on `main` before it can be run at all; it then takes the ref to test as an
# input, which is what lets it be pointed at a feature branch.
name: windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to test (blank = this workflow ref)'
        required: false
        type: string
        default: ''
      node:
        description: 'Node major version'
        required: false
        type: choice
        options: ['22', '24']
        default: '22'

permissions:
  contents: read

concurrency:
  # Deliberately NOT cancel-in-progress: this is a long, on-demand, manually
  # requested measurement. Cancelling one halfway produces no numbers at all.
  group: windows-${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  windows-suite:
    name: windows-suite (report-only)
    runs-on: windows-latest
    # Their box measures ~1s per child process and this suite spawns constantly,
    # so it is expected to be SLOW. If it approaches this ceiling, raise the
    # ceiling or make the suite faster — do NOT buy time by skipping tests, which
    # would corrupt the one number this job exists to produce.
    timeout-minutes: 120
    defaults:
      run:
        # Pinned explicitly rather than relying on the runner default, so the
        # scripts below cannot change meaning if that default ever moves.
        shell: pwsh

    steps:
      - name: Checkout the ref under test
        uses: actions/checkout@v7
        with:
          # The workflow FILE comes from wherever it was dispatched (it must be on
          # the default branch to be dispatchable at all); the CODE under test is
          # whatever ref the operator names. Keeping those two separate is what
          # lets a workflow living on `main` measure a feature branch.
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Node ${{ inputs.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node }}
          cache: npm

      # INFRASTRUCTURE STEPS — these MUST fail the job.
      # A job that cannot install or build has not measured anything, and must
      # never be allowed to report "0 failures" and look like good news.
      - name: Install dependencies
        run: npm ci

      - name: Build (tsc emit + generators)
        run: npm run build

      - name: Report the environment actually measured
        run: |
          $ErrorActionPreference = 'Continue'
          # Recorded because the runner's toolset is PART OF THE RESULT: ac-0005
          # showed a binary present here and absent on the consumer's box, which
          # is precisely how a green leg can be silent about a real failure.
          "OS            : $([System.Environment]::OSVersion.VersionString)"
          "node          : $(node --version)"
          "npm           : $(npm --version)"
          "git           : $(git --version)"
          "ref requested : '$env:INPUT_REF'"
          "commit        : $(git rev-parse HEAD)"
          $jq = Get-Command jq -ErrorAction SilentlyContinue
          if ($jq) { "jq            : PRESENT ($(jq --version)) - NOTE: absent on the consumer's box (ac-0005)" }
          else     { "jq            : absent" }
          exit 0
        env:
          INPUT_REF: ${{ inputs.ref }}

      # THE MEASUREMENT — this step must NOT fail the job.
      # Test failures are the expected output on day one; they are reported, not
      # thrown. Anything that stops us from producing numbers at all is caught by
      # the summarise step below, which DOES fail.
      - name: Run the suite (report-only)
        working-directory: harness/cli
        env:
          # THE SCOPE MUST BE SET EXPLICITLY, AND THIS LINE IS THE WHOLE POINT OF
          # THE JOB. `vitest.config.ts` defaults HARNESS_TEST_SCOPE to `fast`,
          # which SKIPS the slow files; its own comment says "all — everything.
          # What CI sets; what a gate must mean." This workflow did not set it.
          #
          # Measured 2026-08-10: the fast default collects 349 test files and this
          # job reported success five times running. The full suite is 393 files,
          # and at `all` the same sha produces 112 failures — 81 of them one
          # product defect that makes every telemetry git call exit 128 on
          # Windows. Every one of those was invisible here, and the job still
          # rendered green in `gh run list`, which is how it came to be cited as
          # Windows coverage.
          #
          # A platform job that measures a REDUCED default is worse than no
          # platform job: it answers a question nobody asked in the voice of the
          # one they did.
          HARNESS_TEST_SCOPE: all
        run: |
          $ErrorActionPreference = 'Continue'
          # Two reporters on purpose: `default` puts human-readable failures in
          # the log for triage, `json` gives the summary step exact counts rather
          # than something scraped out of console text.
          #
          # Coverage is deliberately NOT collected here. That is not a way of
          # doing less work: coverage is already proven on every push by the
          # ubuntu leg, it does not vary by platform, and instrumenting adds time
          # to a job that is already slow for real reasons.
          "scope: $env:HARNESS_TEST_SCOPE (files collected below must reflect it)"
          npx --no-install vitest run `
            --reporter=default `
            --reporter=json `
            --outputFile.json=vitest-windows.json
          $code = $LASTEXITCODE
          "vitest exit code: $code (non-zero is EXPECTED while the suite is red on Windows)"
          # Warn-launch: the measurement's own exit status never fails this job.
          exit 0

      - name: Summarise — passed / failed / SKIPPED, and what this does not cover
        working-directory: harness/cli
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'vitest-windows.json'

          # ---- GUARD 1: no numbers at all is a BROKEN JOB, and must be loud. ----
          # A missing report means the runner never produced a measurement. The
          # failure mode this prevents is the worst one available to us: a job
          # that quietly reports nothing and reads as "no failures".
          if (-not (Test-Path -LiteralPath $path)) {
            Write-Output "::error title=windows-suite::vitest produced no JSON report — the job did not measure anything. Treat this as a BROKEN JOB, not as a clean suite."
            exit 1
          }

          # Parsed with PowerShell's own ConvertFrom-Json rather than `jq`.
          # `jq` IS installed on this runner, but ac-0005 established it is
          # absent on the consumer's machine, and quietly depending on
          # runner-only tooling is the same class of mistake this whole job
          # exists to expose.
          $r = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json

          $passed   = [int]$r.numPassedTests
          $failed   = [int]$r.numFailedTests
          $skipped  = [int]$r.numPendingTests
          $todo     = [int]$r.numTodoTests
          $total    = [int]$r.numTotalTests

          # FILE counts come from testResults[], NOT from num*TestSuites.
          #
          # `numTotalTestSuites` counts DESCRIBE BLOCKS, not files, and
          # `numFailedTestSuites` inflates the numerator to match. Measured: three
          # files containing nine describes report numTotalTestSuites=9 and, with
          # ONE file failing, numFailedTestSuites=3. Day one printed "6/1378 files"
          # for what was really 3/349.
          #
          # This is not a cosmetic slip. The consumer reports in FILES ("12 files /
          # 27 tests"), and ac-0011 requires comparing our number against theirs, so
          # a suite count under a file label makes the two sides of that comparison
          # different denominators — the exact error class this plan keeps hitting.
          # `testResults[]` has one entry per FILE, so it is the honest source, and
          # it is the same source as the failing-file list below: the table and the
          # list cannot disagree.
          $fileResults = @($r.testResults)
          $failedFileResults = @($fileResults | Where-Object { $_.status -eq 'failed' })
          $filesTot = $fileResults.Count
          $filesBad = $failedFileResults.Count
          $failedFiles = @($failedFileResults | ForEach-Object { $_.name })

          # ---- GUARD 2: a suspiciously LOW total is a suspect JOB. ----
          # Verified locally: when a file fails to COLLECT, vitest reports
          # numTotalTests=0 and numFailedTests=0 for it while still marking the
          # suite failed. So a Windows-specific collection break — precisely the
          # path-shape class this job hunts — can SHRINK the totals and read as
          # "hardly anything failed".
          #
          # Skips do NOT reduce this number (a skipped case is still collected
          # and counted in the total), so this floor tests one thing only:
          # did we collect roughly the whole suite? The consumer's pristine
          # measurement was 5121 total and this branch collects 5132 locally, so
          # 4800 tolerates real drift while catching any material shortfall.
          $MIN_TOTAL = 4800
          $undercollected = $total -lt $MIN_TOTAL

          # The skip count MEASURED on day one (run 31293261626) — not invented.
          #
          # That distinction is the reason this pin is legitimate and it must stay
          # readable here: before day one there was no honest number to pin, so
          # none was written down. This is what the platform actually reported the
          # first time it was asked, and it is a FLOOR to be defended rather than a
          # constant to be adjusted.
          #
          # The failure mode this guards is someone adding a skip and bumping this
          # number in the SAME commit — "we stopped looking" wearing a green. So a
          # rise WARNS and states the delta; it never silently re-baselines. If you
          # move it, move it in its own change and say why the new number is
          # legitimate.
          #
          # The skip count MEASURED on run 31298610502 — not invented, not derived.
          #
          # History, so the number has provenance rather than drifting anonymously:
          #   56  day one          (run 31293261626)
          #   58  +2               (run 31297297873) two discardProbeRoot cases added
          #   28  -30              (run 31298610502) the capture-hook removal
          #
          # The -30 is attributed source by source, all CASE 3 (subject and tests
          # removed together), no case 2:
          #   pre-commit-hook.test.ts   15 skips  file deleted with the hooks
          #   external-binary.test.ts   15 skips  13 pre-existing POSIX-only + the 2
          #                                       discardProbeRoot cases; probeShell
          #                                       has no callers left
          #   post-commit-hook.test.ts   0 skips  see below — it was never skipping
          #
          # `post-commit-hook.test.ts` contributed ZERO to the fall, and that is the
          # clearest single illustration of what this job cannot see. It guarded on
          # `describe.skipIf(!BASH.capable)`, and THIS RUNNER'S bash IS capable — so
          # its 4 cases RAN here, green, in the very file the consumer lost outright
          # to a WSL bash that is not capable. Green-and-running for us, dead for
          # them, same file, same commit.
          #
          # This pin moved in its OWN commit, against a measured number. A baseline
          # bumped inside the change that caused the move is how a number stops
          # meaning anything.
          $EXPECTED_SKIPS = 28
          # Both remaining fully-skipped files were deleted by the capture-hook
          # removal; the 28 that remain are case-level skips.
          $EXPECTED_SKIPPED_FILES = 0

          # Failing files are derived above, from the same source as the table.

          $sum = @()
          $sum += "## windows-latest suite — REPORT ONLY"
          $sum += ""
          $sum += "**This job blocks nothing.** Warn-launch, same posture as ``windows-check`` / ``arch-check`` / ``markdown-lint``."
          $sum += ""
          $sum += "| result | count |"
          $sum += "| --- | ---: |"
          $sum += "| passed | $passed |"
          $sum += "| **failed** | **$failed** |"
          $sum += "| **skipped** | **$skipped** |"
          $sum += "| todo | $todo |"
          $sum += "| total collected | $total |"
          $sum += "| test files failed | $filesBad of $filesTot |"
          # THE DENOMINATOR TRAVELS WITH THE NUMBERS. A count without its scope is
          # unreadable: 349 files green at `fast` and 393 files with 112 failures
          # at `all` are both true of the same sha, and only this row tells them
          # apart. Read from the environment, not hardcoded, so it cannot drift
          # from what actually ran.
          $sum += "| scope | ``$env:HARNESS_TEST_SCOPE`` |"
          $sum += ""
          $sum += "Ref measured: ``$(git rev-parse HEAD)``  ·  node ``$(node --version)``"
          $sum += ""
          $sum += "> **This is THE RUNNER's result, not Windows'.** A green here says the runner is green. What that does and does not license is quantified under *What this job does NOT cover*."
          $sum += ""

          # ---- The skip column, stated as an anti-goal rather than a stat. ----
          #
          # The delta is computed OUTSIDE any `skipped -gt 0` gate, deliberately.
          # A previous version nested the comparison inside it, so a fall to ZERO
          # skipped the check entirely and printed "No tests were skipped on this
          # run" — the largest possible loss of coverage rendered as good news.
          $skipDelta = $skipped - $EXPECTED_SKIPS
          $sum += "### Skips — a green here must never mean ""we stopped looking"""
          $sum += ""
          if ($skipped -gt 0) {
            $sum += "**$skipped test(s) did not run on this platform.** Deliberate skips exist here (the real-``git daemon`` cluster, the URL-scope credential case, the cleanup fault-injection cases), so a non-zero number is expected — it is reported as a number so that it cannot CHANGE quietly in either direction."
            $sum += ""
          } elseif ($EXPECTED_SKIPS -gt 0) {
            $sum += "**ZERO tests were skipped, against a pin of $EXPECTED_SKIPS.** That is not a clean run — it is a fall of $EXPECTED_SKIPS, and it is the single largest coverage change this job can report. Every deliberate skip this suite had has stopped being reported. Find out whether those tests now RUN or no longer EXIST before reading anything else on this page."
            $sum += ""
          } else {
            $sum += "No tests were skipped, and none were expected."
            $sum += ""
          }

          if ($skipDelta -gt 0) {
            $sum += "> **:rotating_light: SKIPS HAVE RISEN by $skipDelta** — $skipped now versus **$EXPECTED_SKIPS, the last MEASURED pin**. Something stopped being measured since then."
            $sum += ">"
            $sum += "> Do NOT re-baseline this in the same change that caused it. Name what stopped being proven, say what still proves it, and move the pin as its own deliberate edit — a skip added and a baseline bumped together is ""we stopped looking"" wearing a green."
          } elseif ($skipDelta -lt 0) {
            # Symmetric with the rise ON PURPOSE. An earlier version framed a fall
            # as unambiguously good ("the new, better floor"), which would have
            # congratulated a suite for DELETING the tests that used to skip.
            $sum += "> **:rotating_light: SKIPS HAVE FALLEN by $(-$skipDelta)** — $skipped now versus **$EXPECTED_SKIPS, the last MEASURED pin**."
            $sum += ">"
            $sum += "> **A fall is not automatically good news, and it is not automatically bad news either.** It means one of three things, and the number cannot tell you which:"
            $sum += ">"
            $sum += "> 1. **Coverage RESTORED** — a case that used to decline now runs here. Good."
            $sum += "> 2. **Coverage DELETED while its subject remains** — the tests went, the code they guarded did not. **This is the dangerous one**, and it is the reading that never gets assumed."
            $sum += "> 3. **Subject and tests removed together** — nothing stopped being proven, because the thing being proven no longer exists. Legitimate, and the commonest cause of a large fall."
            $sum += ">"
            $sum += "> Case 3 is why this is a WARNING and not a failure: a guard that screams at every legitimate deletion gets ignored, and an ignored guard cannot catch case 2 — which is the only one it exists for. So attribute the fall source by source, name WHICH case each part is, and only then move the pin, in its OWN commit."
          } else {
            $sum += "Matches the pinned baseline of **$EXPECTED_SKIPS** — **measured** (day one 56 on run 31293261626; re-pinned to 58 on run 31297297873 when two new fault-injection proofs were added that cannot run on win32), not chosen. Of these, $EXPECTED_SKIPPED_FILES are whole FILES skipped rather than individual cases; a file-level skip and a case-level skip read very differently when scanning this number."
          }
          $sum += ""

          # ---- The honesty column (ac-0005): travels WITH the result. ----
          $sum += "### What this job does NOT cover"
          $sum += ""
          $sum += "A hosted runner is **curated** and is not a proxy for a user's machine. This is no longer an argument — it is **measured**:"
          $sum += ""
          $sum += "> **Day one: this runner reported 3 failing tests. The consumer's box reported 27.** Same suite, same commit family — a **9x gap**."
          $sum += ""
          $sum += "Everything in that gap is real breakage this leg cannot see. ``jq`` is present here and **absent** on their box, so a green leg can be entirely silent about the failure they actually hit. Two defects from this round show the shape of what is missing:"
          $sum += ""
          $sum += "* ``acts/plan`` failed on their machine only because an **unelevated** process cannot create ``C:\out``. A runner with more privilege goes green while creating a directory at the drive root — that defect is invisible to CI **by construction**."
          $sum += "* The **timeout** class is contention-dependent. A quiet runner finishes in 12s what a loaded laptop takes 30s to do, so this leg systematically under-reports load-sensitive failures."
          $sum += ""
          $sum += "**A green run means the path-shape class is covered. It does not mean Windows is fine — the 9x gap is the measurement of exactly how much it does not mean that.**"
          $sum += ""

          # ---- Comparison against the last pristine downstream measurement. ----
          $sum += "### Compare before believing"
          $sum += ""
          $sum += "Consumer's last pristine measurement (``f19bf0d1``): **12 files / 27 tests failing of 5121**, minus whatever ``5a8e8f5b`` fixed."
          $sum += ""
          $sum += "This run: **$filesBad files / $failed tests failing of $total collected**, across $filesTot test files."
          $sum += ""
          $sum += "Day one on this runner (31293261626): **3 files / 3 tests failing of 5164**, across 349 files. Both sides of that comparison are now in FILES — a suite count is not a file count, and mixing them is how two numbers get compared that were never the same measurement."
          $sum += ""
          $sum += "A count *dramatically lower* than the baseline is a **suspect job before it is a suspect suite** — check that the whole suite was collected before reporting the number as an improvement."
          $sum += ""

          if ($failedFiles.Count -gt 0) {
            $sum += "<details><summary>Failing test files ($($failedFiles.Count))</summary>"
            $sum += ""
            foreach ($f in $failedFiles) { $sum += "- ``$f``" }
            $sum += ""
            $sum += "</details>"
            $sum += ""
          }

          $sum -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8NoBOM -Append

          # Annotations, so the three numbers are visible without opening the run.
          Write-Output "::notice title=windows-suite::passed=$passed failed=$failed skipped=$skipped of $total collected ($filesBad/$filesTot files failed)"
          # Direction-aware, and fired on ANY deviation from the pin — including a
          # fall to zero, which the previous version could not announce at all
          # because it only ran when `skipped -gt 0`.
          if ($skipDelta -ne 0) {
            $dir = if ($skipDelta -gt 0) { "ROSE by $skipDelta" } else { "FELL by $(-$skipDelta)" }
            Write-Output "::warning title=windows-suite skips::skip count $dir — $skipped versus the pinned $EXPECTED_SKIPS. A RISE means something stopped being measured; a FALL can mean coverage was DELETED rather than restored. The number cannot tell you which — attribute it before moving the pin."
          } elseif ($skipped -gt 0) {
            Write-Output "::warning title=windows-suite skips::$skipped test(s) did not run on win32 (matching the pinned baseline) — a green suite whose skip count CHANGES in either direction means what it is looking at changed, not that it got better"
          }
          if ($undercollected) {
            Write-Output "::error title=windows-suite undercollected::only $total tests collected, expected at least $MIN_TOTAL — SUSPECT THE JOB, not the suite. A Windows collection failure shrinks the totals and reads as 'hardly anything failed'."
            exit 1
          }

          # Test failures themselves are the expected day-one output: reported, never thrown.
          exit 0

      - name: Upload the raw result (the evidence behind the summary)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-windows-${{ inputs.node }}
          path: harness/cli/vitest-windows.json
          if-no-files-found: warn
