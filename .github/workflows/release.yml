name: Release

on:
  # Main: release-please maintains the Release PR; merging it cuts the release
  # and (below) publishes to the public npm registry. canary/**: pre-merge proof.
  push:
    branches: [main, 'canary/**']
  # workflow_dispatch is only registered once this workflow is on the DEFAULT
  # branch, so for a PRE-merge canary use a push to a `canary/**` branch (push
  # triggers run from the pushed branch's own copy — no default-branch needed).
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# release-please manages semver tags + CHANGELOG from conventional commits. It
# opens/refreshes a Release PR; merging that PR tags + creates a GitHub release,
# which sets `release_created` → the `publish` job pushes the matching version to
# the PUBLIC npm registry as @ai-substrate/engineering-harness, with npm
# PROVENANCE attaching a verifiable link from the version back to this workflow
# run + commit (shown on npmjs.com). Anonymous `npm i -g @ai-substrate/engineering-harness`
# then works with no token. The `canary` job proves the whole publish +
# ANONYMOUS-install path from a branch BEFORE merge.
jobs:
  release-please:
    runs-on: ubuntu-latest
    # Only the real release path (a push to main) runs release-please; the canary
    # triggers (workflow_dispatch / canary/** push) skip it — there's nothing to cut.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Load-bearing: this job-level re-export is what makes the publish gate real.
    # Without it `needs.release-please.outputs.release_created` resolves empty and
    # the publish job would fire on every push.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # A user/PAT token (not the built-in GITHUB_TOKEN) so the Release PRs
          # release-please opens TRIGGER CI — GitHub intentionally suppresses
          # workflows for events created by GITHUB_TOKEN (anti-recursion), which
          # otherwise leaves the Release PR stuck waiting on the required check.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish to the public npm registry — ONLY when release-please actually cut a
  # release. Singular `release_created` (the plural `releases_created` is a v3→v4
  # trap that defaults truthy); string compare because Actions outputs are strings.
  # The published version is whatever release-please already committed to package.json.
  publish:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance (links the version to this run)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          scope: '@ai-substrate'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (latest, public, with provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Canary (AC-11) — prove publish + ANONYMOUS install from a branch BEFORE merge.
  # Triggered by a push to `canary/**` (pre-merge) or workflow_dispatch (post-merge
  # ergonomics). Publishes an ephemeral, NEVER-committed `<base>-canary.<run>`
  # under the `canary` dist-tag (the --tag is load-bearing — without it npm would
  # clobber `latest`). github.run_number guarantees a unique version (npm versions
  # are immutable).
  canary:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/canary/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (npm registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          scope: '@ai-substrate'

      - name: Install dependencies
        run: npm ci

      - name: Set ephemeral canary version (never committed)
        run: |
          BASE=$(node -p "require('./package.json').version")
          npm version --no-git-tag-version "${BASE}-canary.${{ github.run_number }}"
          echo "canary version: $(node -p "require('./package.json').version")"

      - name: Build
        run: npm run build

      - name: Publish (canary dist-tag — never touches latest)
        run: npm publish --tag canary --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify — ANONYMOUS install of @canary runs; latest untouched (AC-11)
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "published canary version: $VER"
          SMOKE=$(mktemp -d); cd "$SMOKE"
          npm init -y >/dev/null 2>&1
          # Anonymous consumer install: PUBLIC package, no .npmrc, no token — that
          # is the whole point of the npmjs migration (FX001).
          npm install "@ai-substrate/engineering-harness@canary"
          echo "installed bin:"; ls -l node_modules/.bin/harness
          ./node_modules/.bin/harness --json help | tee help.json
          grep -q '"status":"ok"' help.json || { echo "::error title=canary::installed bin did not return status ok"; exit 1; }
          echo "dist-tags:"; npm dist-tag ls @ai-substrate/engineering-harness || true
          LATEST=$(npm view @ai-substrate/engineering-harness dist-tags.latest 2>/dev/null || true)
          echo "latest='${LATEST:-<none>}'  canary='$VER'"
          if [ -n "$LATEST" ] && [ "$LATEST" = "$VER" ]; then
            echo "::error title=canary::the canary clobbered the latest dist-tag"; exit 1
          fi
          echo "OK: @canary installs + runs ANONYMOUSLY (status ok); latest not clobbered"
